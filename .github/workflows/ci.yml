name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generated files are in sync
        run: |
          ./scripts/build.sh
          if ! git diff --quiet -- dist adapters; then
            echo "::error::dist/ or adapters/ is stale. Run ./scripts/build.sh and commit."
            git --no-pager diff --stat -- dist adapters
            exit 1
          fi

      - name: Required files exist
        run: |
          missing=0
          while read -r f; do
            [ -n "$f" ] || continue
            if [ -e "$f" ]; then
              echo "ok       $f"
            else
              echo "::error::required file is missing: $f"
              missing=1
            fi
          done <<'FILES'
          .claude-plugin/marketplace.json
          plugins/sharpen/.claude-plugin/plugin.json
          plugins/sharpen/skills/sharpen/SKILL.md
          plugins/sharpen/skills/sharpen/references/examples.md
          plugins/sharpen/skills/sharpen/references/by-task-type.md
          dist/sharpen.md
          adapters/cursor/rules/sharpen.mdc
          scripts/build.sh
          scripts/install.sh
          README.md
          LICENSE
          FILES
          exit "$missing"

      - name: Manifests are valid JSON
        run: |
          bad=0
          for f in .claude-plugin/marketplace.json plugins/sharpen/.claude-plugin/plugin.json; do
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "ok       $f"
            else
              echo "::error::$f is missing or not valid JSON"
              bad=1
            fi
          done
          exit "$bad"

      - name: SKILL.md has required frontmatter
        run: |
          f=plugins/sharpen/skills/sharpen/SKILL.md
          head -1 "$f" | grep -qx -- '---' || { echo "::error::$f must start with ---"; exit 1; }
          grep -qm1 '^name: sharpen$' "$f" || { echo "::error::missing name"; exit 1; }
          grep -qm1 '^description: ' "$f" || { echo "::error::missing description"; exit 1; }
          echo "ok  frontmatter"

      - name: SKILL.md stays lean
        run: |
          f=plugins/sharpen/skills/sharpen/SKILL.md
          n=$(wc -l < "$f")
          echo "SKILL.md is $n lines"
          [ "$n" -le 160 ] || { echo "::error::SKILL.md is $n lines, limit is 160. Move material to references/."; exit 1; }

      - name: Shell scripts pass shellcheck
        run: shellcheck scripts/*.sh
