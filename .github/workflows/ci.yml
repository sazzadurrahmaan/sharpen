name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generated files are in sync
        run: |
          ./scripts/build.sh
          if ! git diff --quiet -- dist adapters; then
            echo "::error::dist/ or adapters/ is stale. Run ./scripts/build.sh and commit."
            git --no-pager diff --stat -- dist adapters
            exit 1
          fi

      - name: Required files exist
        run: |
          missing=0
          while read -r f; do
            [ -n "$f" ] || continue
            if [ -e "$f" ]; then
              echo "ok       $f"
            else
              echo "::error::required file is missing: $f"
              missing=1
            fi
          done <<'FILES'
          .claude-plugin/marketplace.json
          plugins/sharpen/.claude-plugin/plugin.json
          plugins/sharpen/skills/sharpen/SKILL.md
          plugins/sharpen/skills/sharpen/references/examples.md
          plugins/sharpen/skills/sharpen/references/by-task-type.md
          dist/sharpen.md
          adapters/cursor/rules/sharpen.mdc
          scripts/build.sh
          scripts/install.sh
          README.md
          LICENSE
          FILES
          exit "$missing"

      - name: Manifests are valid JSON
        run: |
          bad=0
          for f in .claude-plugin/marketplace.json plugins/sharpen/.claude-plugin/plugin.json; do
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "ok       $f"
            else
              echo "::error::$f is missing or not valid JSON"
              bad=1
            fi
          done
          exit "$bad"

      - name: Manifest versions agree
        run: |
          python3 - <<'PY'
          import json, sys
          mk = json.load(open(".claude-plugin/marketplace.json"))
          pl = json.load(open("plugins/sharpen/.claude-plugin/plugin.json"))
          entry = next(p for p in mk["plugins"] if p["name"] == "sharpen")
          versions = {
              "plugin.json": pl["version"],
              "marketplace.json (plugin entry)": entry["version"],
              "marketplace.json (metadata)": mk["metadata"]["version"],
          }
          if len(set(versions.values())) != 1:
              for k, v in versions.items():
                  print(f"::error::version mismatch — {k} says {v}")
              sys.exit(1)
          print(f"ok       all manifests at {pl['version']}")
          PY

      - name: SKILL.md conforms to the Agent Skills spec
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          d = pathlib.Path("plugins/sharpen/skills/sharpen")
          t = (d / "SKILL.md").read_text()
          errs = []
          if not t.startswith("---\n"):
              errs.append("SKILL.md must open with YAML frontmatter")
          fm = t.split("---", 2)[1] if t.startswith("---\n") else ""
          def field(k):
              m = re.search(rf"^{k}: (.+)$", fm, re.M)
              return m.group(1).strip() if m else None
          name, desc = field("name"), field("description")
          if not name:
              errs.append("frontmatter is missing required field: name")
          else:
              if not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name) or len(name) > 64:
                  errs.append(f"name {name!r} breaks the spec (lowercase, digits, single hyphens, <=64 chars)")
              if name != d.name:
                  errs.append(f"name {name!r} must match the parent directory {d.name!r}")
          if not desc:
              errs.append("frontmatter is missing required field: description")
          elif len(desc) > 1024:
              errs.append(f"description is {len(desc)} chars, spec limit is 1024")
          allowed = {"name", "description", "license", "compatibility", "metadata", "allowed-tools"}
          extra = {k for k in re.findall(r"^([a-zA-Z][\w-]*):", fm, re.M)} - allowed
          if extra:
              errs.append(f"non-spec frontmatter fields break portability: {sorted(extra)}")
          n = len(t.splitlines())
          if n > 500:
              errs.append(f"SKILL.md is {n} lines, spec recommends under 500")
          for e in errs:
              print(f"::error::{e}")
          print("ok       SKILL.md conforms" if not errs else "")
          sys.exit(1 if errs else 0)
          PY

      - name: Shell scripts pass shellcheck
        run: shellcheck scripts/*.sh
